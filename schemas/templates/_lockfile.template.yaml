# orchestra v2.0.0 — Lockfile shape reference.
#
# This file documents the canonical shape of <artifact>.lock.yaml. The actual
# lockfiles are written by scripts/scaffold-artifact.js with type-specific
# seeded `sections:` and `diagrams:` blocks. See schemas/lockfile.schema.md
# for the normative spec.
#
# Grammar constraint: yaml-mini block-style only (hooks/lib/yaml-mini.js).
# No flow style, no anchors/aliases, hash strings always quoted.

artifact_id: <ID>                        # mirrors artifact frontmatter id
artifact_path: <relative-path>           # relative to .claude/.orchestra/
schema_revision: 1
sections:
  S-EXAMPLE-001:
    hash: "TBD"                          # OR "sha256:..." OR "TBD-UNRESOLVED"
    confirmed: true                      # OR inferred: true (mutually exclusive)
references:
  - type: prd                            # sad | charter | prd | frs | tdd | contract | api | tasks | test | tsr | adr | release | runbook
    id: 001-foo                          # feature-scoped id; "" for singletons (sad/release/runbook); "ADR-NNNN-slug" for ADRs
    section: S-PROBLEM-001
    hash-at-write: "TBD"                 # hash-stamper resolves on write
diagrams:
  - kind: usecase                        # see schemas/lockfile.schema.md §S-KINDS-001 for enum
    source: diagrams/frs-usecase.puml    # path relative to artifact's dir
    rendered: diagrams/frs-usecase.svg
    source_hash: "TBD"
    rendered_hash: "TBD"                 # OR "sha256:UNRENDERED" when PlantUML missing
    omit: false                          # true for state-machine when no lifecycle exists
